name: rendzu
description: "Рэндзю для Дианы — детская игра пять-в-ряд на Flutter."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Audio
  audioplayers: ^6.1.0

  # Network
  web_socket_channel: ^3.0.1
  shelf: ^1.4.1
  shelf_web_socket: ^3.0.0
  nsd: ^3.0.0

  # Storage
  shared_preferences: ^2.3.2

  # Fonts & utils
  google_fonts: ^6.2.1
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
